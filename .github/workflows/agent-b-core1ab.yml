name: Agent B Core1AB source-neutral academic safeguards

on:
  pull_request:
    paths:
      - 'tools/agent_b_core1ab_audit.py'
      - 'tests/test_agent_b_core1ab_audit.py'
      - '.github/workflows/agent-b-core1ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Run synthetic B4/B5 falsifiers
        run: python -m pytest -q tests/test_agent_b_core1ab_audit.py
