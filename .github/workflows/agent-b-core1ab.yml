name: Agent B Core1AB source-neutral academic safeguards

on:
  pull_request:
    paths:
      - 'tools/agent_b_core1ab_audit.py'
      - 'tests/test_agent_b_core1ab_audit.py'
      - 'tests/test_agent_b_science_topups.py'
      - 'tests/test_agent_b_authored_corrections.py'
      - 'tools/agent_b_core1ab_authoring.py'
      - 'tools/check_agent_b_core1ab_http.py'
      - 'build_d3_expansion_modules.py'
      - 'build_d3_batch2_modules.py'
      - 'build_bio_genetics_core1.py'
      - 'build_physics_fluids_core1.py'
      - 'docs/agent-b-core1ab-construction-handoff-r1.md'
      - 'docs/agent-b-core1ab-candidate-topups.md'
      - 'docs/agent-b-core1ab-preflight.md'
      - 'docs/agent-b-physics-uid-lookup-r1.json'
      - 'tools/agent_b_core1ab_reconcile.py'
      - 'tests/test_agent_b_core1ab_reconcile.py'
      - '.github/workflows/agent-b-core1ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Run synthetic B4/B5 falsifiers
        run: python -m pytest -q tests/test_agent_b_core1ab_audit.py tests/test_agent_b_science_topups.py tests/test_agent_b_authored_corrections.py tests/test_agent_b_core1ab_reconcile.py


  real-http-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Run actual HTTP desktop/mobile Core1B protection
        run: python tools/check_agent_b_core1ab_http.py

  candidate-census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce public builder candidates and report identity/academic HOLDs
        run: |
          python tools/agent_b_core1ab_reconcile.py --generate --out agent-b-core1ab-census.json
      - name: Upload source-neutral audit only
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-core1ab-census
          path: agent-b-core1ab-census.json
          if-no-files-found: error

  existing-core1-qualification-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and original dev test requirements
        run: python -m pip install -e ".[dev]"
      - name: Rebuild the eight public authored candidate modules in clean checkout
        run: |
          python build_d3_batch2_modules.py
          python build_d3_expansion_modules.py
          python build_physics_fluids_core1.py
          python build_bio_genetics_core1.py
      - name: Execute eight original Core1A/Core1B scientific and B1-B7 test modules
        run: |
          python -m pytest -q             tests/test_nsejs_optics_displacement_d3_core1.py             tests/test_nsejs_fluids_surface_energy_d3_core1.py             tests/test_chem_electronic_structure_d3_core1.py             tests/test_bio_immunology_defense_d3_core1.py             tests/test_chem_phosphorus_oxyacids_d3_core1.py             tests/test_bio_viral_genetics_d3_core1.py             tests/test_bio_genetics_coordination_core1.py             tests/test_nsejs_fluids_sound_core1.py
