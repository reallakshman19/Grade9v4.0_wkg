name: NSEJS Wave 3 authored source learner routing Chromium
on:
  pull_request:
    paths:
      - 'nsejs/js/core2-learning-route.js'
      - 'nsejs/physics/question-bank.html'
      - 'nsejs/data/source-learning-bridge-tech-preview.v1.json'
      - 'nsejs/data/mechanics-wpe-teaching-pilot.v1.json'
      - 'browser_tests/test_nsejs_wave3_source_return.py'
      - '.github/workflows/nsejs-wave3-source-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium test runtime
        run: |
          python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: JS syntax, unchanged Core2 source ledger
        run: |
          node --check nsejs/js/core2-learning-route.js
          node --check nsejs/js/core2-physics-reader.js
      - name: Check exact source UID/revision link, focus and fail-closed regressions
        run: python -m pytest -q browser_tests/test_nsejs_wave3_source_return.py
