name: NSEJS WPE-parity six-stage runtime Chromium witness
on:
  pull_request:
    paths:
      - 'nsejs/js/wpe-contract-adapter.js'
      - 'nsejs/physics/learn-mechanics.html'
      - 'nsejs/css/wpe-touch-parity.css'
      - 'nsejs/contracts/**'
      - 'nsejs/data/source-learning-bridge-pilot.v1.json'
      - 'nsejs/data/mechanics-wpe-teaching-pilot.v1.json'
      - 'browser_tests/test_nsejs_wpe_runtime_browser.py'
      - '.github/workflows/nsejs-wpe-parity-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Verify JavaScript syntax of the NSEJS adapter and unchanged WPE engine
        run: |
          node --check nsejs/js/wpe-contract-adapter.js
          node --check physics/wpe/gap-six-stage-engine.js
      - name: Run real HTTP Chromium independent Task A/B learner journeys
        run: python -m pytest -v browser_tests/test_nsejs_wpe_runtime_browser.py
