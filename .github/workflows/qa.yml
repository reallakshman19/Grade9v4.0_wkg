name: Python QA
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Regenerate eight tracked authored Core1A/B candidates (never original exam fixtures)
        run: |
          python build_d3_batch2_modules.py
          python build_d3_expansion_modules.py
          python build_physics_fluids_core1.py
          python build_bio_genetics_core1.py
      - run: python -m pytest -q
