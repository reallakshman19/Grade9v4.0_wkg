name: Python QA
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify reproducibility diagnostics and false-green controls
        run: python -m pytest -q tests/test_qa_reproducibility.py
      - name: Deterministically regenerate checked-in authored modules only
        run: python tools/qa_reproducibility.py bootstrap
      - name: Run full unfiltered Python QA and emit failure classification
        run: |
          mkdir -p qa-artifacts
          python tools/qa_reproducibility.py run --json-out qa-artifacts/failures.json --junit-out qa-artifacts/junit.xml
      - name: Preserve exact-version classified QA receipt (not approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsejs-py${{ matrix.python-version }}-full-qa-fail-closed
          path: qa-artifacts/
          if-no-files-found: warn

