name: NSEJS Wave 2 actual authored Mechanics E2E qualification
on:
  pull_request:
    paths:
      - 'nsejs/js/wpe-contract-adapter.js'
      - 'nsejs/data/mechanics-wpe-teaching-pilot.v1.json'
      - 'nsejs/physics/learn-mechanics.html'
      - 'nsejs/css/wpe-touch-parity.css'
      - 'tests/test_nsejs_wpe_real_pilot_browser.py'
      - 'tests/test_nsejs_mechanics_teaching_pilot.py'
      - '.github/workflows/nsejs-wave2-joint-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave2-authored-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium runtime
        run: |
          python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Verify old WPE and new JS parse without changing WPE
        run: |
          node --check physics/wpe/gap-six-stage-engine.js
          node --check nsejs/js/wpe-contract-adapter.js
      - name: Verify actual source, schema, physics and boundary arithmetic
        run: |
          python -m pytest -q tests/test_source_learning_bridge_pilot.py tests/test_nsejs_wpe_learner_contract.py tests/test_nsejs_mechanics_teaching_pilot.py
      - name: Verify complete actual student path in 12.7-inch portrait/landscape Chromium
        run: |
          python -m pytest -v tests/test_nsejs_wpe_runtime_browser.py tests/test_nsejs_wpe_real_pilot_browser.py
