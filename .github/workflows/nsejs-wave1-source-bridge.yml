name: NSEJS Wave 1 source-bridge exact-head checks
on:
  pull_request:
    paths:
      - 'nsejs/data/source-learning-bridge-pilot.v1.json'
      - 'tools/source_learning_bridge.py'
      - 'tests/test_source_learning_bridge_pilot.py'
      - '.github/workflows/nsejs-wave1-source-bridge.yml'
  push:
    branches: [integration/nsejs-wpe-parity-r1]
    paths:
      - 'nsejs/data/source-learning-bridge-pilot.v1.json'
      - 'tools/source_learning_bridge.py'
      - 'tests/test_source_learning_bridge_pilot.py'
      - '.github/workflows/nsejs-wave1-source-bridge.yml'
permissions:
  contents: read
jobs:
  source-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Source-to-lesson revision/identity and adversarial checks
        run: |
          python -m pytest -q tests/test_source_learning_bridge_pilot.py
          python tools/source_learning_bridge.py
