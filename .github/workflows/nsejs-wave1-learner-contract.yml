name: NSEJS Wave 1 six-stage learning contract exact-head checks
on:
  pull_request:
    paths:
      - 'nsejs/contracts/**'
      - 'tests/test_nsejs_wpe_learner_contract.py'
      - '.github/workflows/nsejs-wave1-learner-contract.yml'
  push:
    branches: [integration/nsejs-wpe-parity-r1]
    paths:
      - 'nsejs/contracts/**'
      - 'tests/test_nsejs_wpe_learner_contract.py'
      - '.github/workflows/nsejs-wave1-learner-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Validate WPE adapter schema and first-attempt safeguards
        run: python -m pytest -q tests/test_nsejs_wpe_learner_contract.py
