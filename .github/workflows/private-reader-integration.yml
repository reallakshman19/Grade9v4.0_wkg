name: Private reader builder - synthetic HTTP integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/private_reader_integration.py'
      - 'tools/private_reader_12p7.css'
      - 'tools/check_private_reader_http.py'
      - 'tests/test_private_reader_integration.py'
      - 'docs/private-reader-integration.md'
      - '.github/workflows/private-reader-integration.yml'

permissions:
  contents: read

jobs:
  synthetic-reader-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests and Chromium
        run: |
          python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Python source-preservation and negative controls
        run: python -m pytest -q tests/test_private_reader_integration.py
      - name: Chromium direct HTTP synthetic 12.7-inch tablet/desktop - no DOM fallback
        run: python tools/check_private_reader_http.py
